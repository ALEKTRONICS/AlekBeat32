<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DrumProject</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121b2b;
        --panel-2: #1a263d;
        --text: #edf6ff;
        --muted: #9bb4d1;
        --accent: #5cc8ff;
        --accent-2: #6ee7b7;
        --danger: #ff7b7b;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg), #111827);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: min(860px, calc(100vw - 32px));
        background: rgba(18, 27, 43, 0.95);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        box-shadow: 0 24px 60px rgba(0,0,0,0.35);
        padding: 28px 24px 20px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.8rem, 3vw, 2.6rem);
      }

      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 18px;
      }

      .warning {
        margin-top: 16px;
        padding: 12px 14px;
        background: rgba(255, 123, 123, 0.08);
        border-left: 4px solid var(--danger);
        color: #ffdede;
        border-radius: 8px;
      }

      esp-web-install-button {
        display: block;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>DrumProject</h1>
      <p>Connect your ESP32 board over USB, then click the button below to flash the firmware and LittleFS data.</p>

      <esp-web-install-button manifest="manifest.json">
        <button slot="activate">Connect and flash</button>
        <button slot="loading">Flashing…</button>
        <button slot="success">Flash complete</button>
        <button slot="error">Flash failed</button>
      </esp-web-install-button>

      <div class="warning">
        Make sure your board is in the bootloader/flash mode and the browser has permission to access the COM port.
      </div>
    </div>

    <script type="module" src="https://espressif.github.io/esp-web-flasher/dist/web/install-button.js?module"></script>
  </body>
</html>
